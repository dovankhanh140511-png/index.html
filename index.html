<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Hưng Vua A6 AI Camera</title>
  <style>
    :root { --bg:#000; --glass:rgba(18,18,22,.64); --panel:rgba(16,16,20,.92); --border:rgba(255,255,255,.15); --text:#fafafa; --muted:#a1a1aa; --green:#22c55e; --glow:rgba(34,197,94,.35); --amber:#fbbf24; --top:env(safe-area-inset-top,14px); --bot:env(safe-area-inset-bottom,18px); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
    html,body { margin:0; padding:0; width:100%; height:100%; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; touch-action:none; }
    .app,.stage { position:relative; width:100%; height:100%; background:#050507; overflow:hidden; }
    #cameraVideo,#glCanvas,#overlayCanvas { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #cameraVideo { opacity:0; pointer-events:none; z-index:0; }
    #cameraVideo.fallback { opacity:1; }
    #glCanvas { z-index:1; pointer-events:none; }
    #overlayCanvas { z-index:2; touch-action:none; }
    #cameraVideo.mirrored,#glCanvas.mirrored,#overlayCanvas.mirrored { transform:scaleX(-1); }
    .top-hud { position:absolute; top:0; left:0; right:0; z-index:10; padding:calc(var(--top) + 10px) 14px 20px; background:linear-gradient(to bottom,rgba(0,0,0,.78),rgba(0,0,0,.2) 70%,transparent); display:flex; flex-direction:column; gap:8px; pointer-events:none; }
    .top-row,.top-controls,.telemetry-bar { display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap; pointer-events:auto; }
    .telemetry-bar { justify-content:flex-start; pointer-events:none; }
    .status-pill { display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:999px; background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--border); font-size:12px; font-weight:600; transition:.2s; }
    .status-pill.good { background:rgba(20,83,45,.78); border-color:rgba(74,222,128,.7); color:#dcfce7; box-shadow:0 4px 18px var(--glow); }
    .status-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0; }
    .status-pill.ai-wait .status-dot { background:var(--amber); }
    .status-pill.good .status-dot { background:#4ade80; box-shadow:0 0 10px #4ade80; }
    .status-pill.loading .status-dot { background:#60a5fa; animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.35;transform:scale(.75)} }
    .chip-btn { height:32px; padding:0 11px; border-radius:999px; border:1px solid var(--border); background:var(--glass); backdrop-filter:blur(16px); color:var(--muted); font-size:11.5px; font-weight:700; cursor:pointer; }
    .chip-btn.on { border-color:rgba(74,222,128,.55); background:rgba(20,83,45,.55); color:#bbf7d0; }
    .chip-btn.rescan { border-color:rgba(251,191,36,.6); background:rgba(120,53,15,.55); color:#fde68a; display:none; }
    .chip-btn.rescan.show { display:inline-flex; align-items:center; }
    .ratio-switch { display:none; padding:2px; border-radius:999px; background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--border); }
    .ratio-switch.show { display:flex; }
    .ratio-btn { border:none; background:transparent; color:rgba(255,255,255,.68); font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; cursor:pointer; }
    .ratio-btn.active { background:#fff; color:#09090b; }
    .tele-chip { padding:3px 8px; border-radius:6px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.08); font-size:10.5px; font-weight:600; color:rgba(255,255,255,.8); }
    .zoom-bar { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(var(--bot) + 106px); z-index:11; display:flex; align-items:center; gap:4px; padding:4px; border-radius:999px; background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--border); }
    .zoom-pill { min-width:40px; height:30px; border-radius:999px; border:none; background:transparent; color:rgba(255,255,255,.78); font-size:11.5px; font-weight:700; cursor:pointer; transition:.15s; }
    .zoom-pill.active { background:#fbbf24; color:#09090b; }
    .color-drawer { position:absolute; left:12px; right:12px; bottom:calc(var(--bot) + 152px); z-index:12; padding:14px; border-radius:20px; background:var(--panel); backdrop-filter:blur(22px); border:1px solid var(--border); box-shadow:0 18px 42px rgba(0,0,0,.68); display:none; flex-direction:column; gap:11px; }
    .color-drawer.open { display:flex; }
    .slider-row { display:flex; flex-direction:column; gap:5px; }
    .slider-head,.lut-header { display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:600; }
    .slider-val { color:#fde68a; font-variant-numeric:tabular-nums; font-weight:700; }
    .mini-reset { border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.08); color:#e4e4e7; font-size:10.5px; padding:2px 8px; border-radius:999px; cursor:pointer; margin-left:6px; }
    .range-track { -webkit-appearance:none; appearance:none; width:100%; height:8px; border-radius:999px; outline:none; margin:4px 0; }
    .range-temp { background:linear-gradient(90deg,#3b82f6 0%,#e4e4e7 50%,#f59e0b 100%); }
    .range-intensity { background:linear-gradient(90deg,#27272a 0%,#22c55e 100%); }
    .range-track::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; border:2px solid #09090b; box-shadow:0 2px 8px rgba(0,0,0,.55); }
    .add-lut-btn { border:1px solid rgba(74,222,128,.45); background:rgba(20,83,45,.45); color:#bbf7d0; font-size:11.5px; font-weight:700; padding:5px 11px; border-radius:999px; cursor:pointer; }
    .lut-strip { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
    .lut-strip::-webkit-scrollbar { display:none; }
    .lut-card { position:relative; flex:0 0 auto; min-width:74px; padding:8px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); color:#d4d4d8; font-size:11px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; }
    .lut-card.active { background:rgba(255,255,255,.16); border-color:#4ade80; color:#fff; }
    .lut-swatch { width:22px; height:22px; border-radius:50%; border:1.5px solid rgba(255,255,255,.35); }
    .lut-name { max-width:70px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lut-del { position:absolute; top:2px; right:3px; width:16px; height:16px; border-radius:50%; border:none; background:rgba(239,68,68,.9); color:#fff; font-size:10px; font-weight:800; line-height:16px; padding:0; }
    .bottom-dock { position:absolute; bottom:0; left:0; right:0; z-index:10; padding:20px 24px calc(var(--bot) + 16px); background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.65) 60%,transparent); display:grid; grid-template-columns:1fr auto 1fr; align-items:center; }
    .dock-btn { width:50px; height:50px; border-radius:50%; border:1px solid var(--border); background:var(--glass); backdrop-filter:blur(16px); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
    .dock-btn.left { justify-self:start; }
    .dock-btn.right { justify-self:end; width:auto; padding:0 14px; border-radius:999px; gap:6px; font-size:12px; font-weight:700; }
    .dock-btn.active-panel { border-color:#fde68a; background:rgba(245,158,11,.28); color:#fef3c7; }
    .shutter-btn { width:76px; height:76px; border-radius:50%; border:3.5px solid rgba(255,255,255,.92); background:rgba(255,255,255,.08); padding:5px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.2s; }
    .shutter-core { width:100%; height:100%; border-radius:50%; background:#fff; transition:.14s; }
    .shutter-btn.ready { border-color:#4ade80; box-shadow:0 0 22px var(--glow); }
    .shutter-btn.ready .shutter-core { background:#22c55e; }
    .shutter-btn:active .shutter-core { transform:scale(.86); }
    .shutter-btn:disabled { opacity:.4; pointer-events:none; }
    .modal-backdrop { position:fixed; inset:0; z-index:35; background:rgba(0,0,0,.72); backdrop-filter:blur(8px); display:none; align-items:flex-end; justify-content:center; padding:16px 14px calc(var(--bot) + 14px); }
    .modal-backdrop.open { display:flex; }
    .source-sheet { width:100%; max-width:440px; border-radius:22px; background:#141418; border:1px solid var(--border); padding:18px; display:flex; flex-direction:column; gap:12px; }
    .source-title { display:flex; align-items:center; justify-content:space-between; font-size:16px; font-weight:700; }
    .close-x { width:30px; height:30px; border-radius:50%; border:none; background:rgba(255,255,255,.1); color:#fff; font-size:16px; }
    .source-note { font-size:12px; line-height:1.45; color:var(--muted); background:rgba(34,197,94,.08); border:1px solid rgba(74,222,128,.22); padding:10px 12px; border-radius:12px; }
    .url-box { display:flex; gap:8px; }
    .url-input { flex:1; min-height:46px; border-radius:12px; border:1px solid rgba(255,255,255,.16); background:#09090b; color:#fff; padding:0 12px; font-size:13px; outline:none; user-select:text; }
    .preview-modal { position:fixed; inset:0; z-index:30; background:#070709; display:none; flex-direction:column; padding:calc(var(--top) + 14px) 18px calc(var(--bot) + 20px); }
    .preview-modal.open { display:flex; }
    .preview-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .preview-title { font-size:16px; font-weight:700; }
    .preview-sub { font-size:12px; color:var(--muted); }
    .preview-res-badge { font-size:12px; font-weight:700; color:#86efac; background:rgba(34,197,94,.16); border:1px solid rgba(74,222,128,.35); padding:5px 11px; border-radius:999px; }
    .preview-frame { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:18px; background:#0e0e12; border:1px solid rgba(255,255,255,.1); }
    .preview-frame img { max-width:100%; max-height:100%; object-fit:contain; }
    .preview-actions { display:grid; grid-template-columns:1fr 1.45fr; gap:12px; margin-top:16px; }
    .action-btn { min-height:50px; border-radius:14px; border:1px solid var(--border); font-size:14px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    .btn-retake { background:#1e1e24; color:var(--text); }
    .btn-save { background:linear-gradient(135deg,#22c55e,#16a34a); color:#032210; border-color:#4ade80; }
    .error-sheet { position:absolute; inset:0; z-index:25; background:rgba(5,5,7,.94); display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:32px; gap:14px; }
    .error-sheet.show { display:flex; }
    .toast-pill { position:fixed; top:calc(var(--top) + 64px); left:50%; transform:translateX(-50%); z-index:50; background:rgba(24,24,29,.94); border:1px solid rgba(255,255,255,.18); color:#fff; font-size:12.5px; font-weight:600; padding:9px 16px; border-radius:999px; display:none; white-space:nowrap; }
    .toast-pill.show { display:block; }
    .flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:40; transition:opacity .16s ease; }
    .flash.active { opacity:.72; transition:none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="stage" id="stage">
      <video id="cameraVideo" autoplay playsinline muted></video>
      <canvas id="glCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
      <div class="top-hud">
        <div class="top-row">
          <div class="status-pill" id="statusBadge"><span class="status-dot"></span><span id="statusText">Chụp thường</span></div>
          <div class="top-controls">
            <button class="chip-btn rescan" id="rescanBtn">Quét lại</button>
            <button class="chip-btn" id="toggleAiBtn">AI: Tắt</button>
            <div class="ratio-switch" id="ratioSwitch">
              <button class="ratio-btn active" data-ratio="0.8">4:5</button>
              <button class="ratio-btn" data-ratio="0.75">3:4</button>
            </div>
          </div>
        </div>
        <div class="telemetry-bar">
          <span class="tele-chip" id="metaInfo">CAMERA • ĐANG MỞ...</span>
          <span class="tele-chip" id="zoomInfo">1.0×</span>
          <span class="tele-chip" id="colorInfo">Gốc • 5500K</span>
        </div>
      </div>

      <div class="zoom-bar" id="zoomBar">
        <button class="zoom-pill active" data-z="1">1×</button>
        <button class="zoom-pill" data-z="2">2×</button>
        <button class="zoom-pill" data-z="3">3×</button>
      </div>

      <div class="color-drawer" id="colorDrawer">
        <div class="slider-row">
          <div class="slider-head"><span>Nhiệt độ màu<button class="mini-reset" id="resetTempBtn">5500K</button></span><span class="slider-val" id="tempVal">5500K • Chuẩn</span></div>
          <input type="range" class="range-track range-temp" id="tempSlider" min="2500" max="8500" step="100" value="5500" />
        </div>
        <div class="slider-row" id="intensityRow" style="display:none;">
          <div class="slider-head"><span>Cường độ LUT</span><span class="slider-val" id="intensityVal" style="color:#86efac;">85%</span></div>
          <input type="range" class="range-track range-intensity" id="intensitySlider" min="0" max="100" step="5" value="85" />
        </div>
        <div class="lut-header"><span>Bộ màu 3D LUT</span><button class="add-lut-btn" id="openSourceBtn">+ Thêm LUT</button></div>
        <div class="lut-strip" id="lutStrip"></div>
      </div>

      <div class="error-sheet" id="errorOverlay">
        <h2>Không thể mở Camera</h2><p id="errorDesc">Vui lòng cấp quyền Camera.</p>
        <button class="action-btn btn-save" id="retryBtn" style="padding:0 28px;">Thử lại</button>
      </div>

      <div class="bottom-dock">
        <button class="dock-btn left" id="switchCamBtn" aria-label="Đổi camera">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
        </button>
        <button class="shutter-btn" id="shutterBtn" disabled><span class="shutter-core"></span></button>
        <button class="dock-btn right" id="toggleColorBtn">Màu / LUT</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="sourceModal">
    <div class="source-sheet">
      <div class="source-title"><span>Nạp LUT an toàn (.cube)</span><button class="close-x" id="closeSourceBtn">✕</button></div>
      <div class="source-note">Chỉ đọc file văn bản <b>.cube</b> dưới 5MB, lưu offline vào máy.</div>
      <input type="file" id="lutFileInput" accept=".cube,.txt" style="display:none;" />
      <button class="action-btn btn-save" id="pickFileBtn">Chọn file .cube từ điện thoại</button>
      <div class="url-box"><input type="url" class="url-input" id="lutUrlInput" placeholder="Hoặc dán link https://.../film.cube" /><button class="action-btn btn-retake" id="loadUrlBtn" style="padding:0 16px;">Tải</button></div>
    </div>
  </div>

  <div class="preview-modal" id="previewModal">
    <div class="preview-top"><div><div class="preview-title">Ảnh đã chụp</div><div class="preview-sub" id="previewSub">Độ phân giải gốc</div></div><div class="preview-res-badge" id="previewRes">0 × 0 px</div></div>
    <div class="preview-frame"><img id="previewImg" alt="Ảnh" /></div>
    <div class="preview-actions"><button class="action-btn btn-retake" id="retakeBtn">Chụp lại</button><button class="action-btn btn-save" id="downloadBtn">Tải ảnh về</button></div>
  </div>
  <div class="toast-pill" id="toastEl"></div><div class="flash" id="flashEl"></div>

  <script type="module">
    import { FilesetResolver, ObjectDetector } from "./mediapipe/vision_bundle.mjs";
    const $ = (id) => document.getElementById(id);
    const video = $("cameraVideo"), glCanvas = $("glCanvas"), overlayCanvas = $("overlayCanvas"), ctx = overlayCanvas.getContext("2d"), stage = $("stage");
    const statusBadge = $("statusBadge"), statusText = $("statusText"), metaInfo = $("metaInfo"), zoomInfo = $("zoomInfo"), colorInfo = $("colorInfo");
    const shutterBtn = $("shutterBtn"), switchCamBtn = $("switchCamBtn"), toggleAiBtn = $("toggleAiBtn"), rescanBtn = $("rescanBtn"), ratioSwitch = $("ratioSwitch");
    const ratioBtns = document.querySelectorAll(".ratio-btn"), zoomPills = document.querySelectorAll(".zoom-pill"), toggleColorBtn = $("toggleColorBtn"), colorDrawer = $("colorDrawer");
    const tempSlider = $("tempSlider"), tempVal = $("tempVal"), resetTempBtn = $("resetTempBtn"), intensityRow = $("intensityRow"), intensitySlider = $("intensitySlider"), intensityVal = $("intensityVal"), lutStrip = $("lutStrip");
    const openSourceBtn = $("openSourceBtn"), sourceModal = $("sourceModal"), closeSourceBtn = $("closeSourceBtn"), pickFileBtn = $("pickFileBtn"), lutFileInput = $("lutFileInput"), lutUrlInput = $("lutUrlInput"), loadUrlBtn = $("loadUrlBtn");
    const errorOverlay = $("errorOverlay"), errorDesc = $("errorDesc"), retryBtn = $("retryBtn"), previewModal = $("previewModal"), previewImg = $("previewImg"), previewRes = $("previewRes"), previewSub = $("previewSub"), retakeBtn = $("retakeBtn"), downloadBtn = $("downloadBtn"), toastEl = $("toastEl"), flashEl = $("flashEl");

    const aiCanvas = document.createElement("canvas"), aiCtx = aiCanvas.getContext("2d");
    const IGNORE_BG = new Set(["chair","couch","bed","dining table","tv","refrigerator","toilet","sink","bench"]);
    let objectDetector = null, aiLoading = false, currentStream = null, videoTrack = null, camCaps = {};
    let facingMode = "environment", targetRatio = 0.8, aiEnabled = false;
    // Trạng thái AI: "off" | "scanning" | "guiding" | "ready"
    let aiPhase = "off", scanStartTs = 0, scanSamples = [], lockedTrack = null, alignStartTs = 0, bestAnchor = { x: 0.36, y: 0.34 };
    let rafId = null, aiTimerId = null, isInferring = false, lastInferTs = 0, smoothedCrop = null, focusRing = null;
    let userZoom = 1.0, activeZoom = 1.0, hwZoom = 1.0, lastHwApply = 0, camCX = 0, camCY = 0, camReady = false;
    let capturedDataUrl = null, capturedBlob = null, kelvin = 5500, lutIntensity = 0.85, activeLutId = "none", lutList = [];

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const showToast = (msg) => { toastEl.textContent = msg; toastEl.classList.add("show"); clearTimeout(showToast._t); showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2300); };

    function getTempGains(k) {
      const t = clamp((k - 5500) / 3000, -1, 1);
      const r = t >= 0 ? 1 + .28*t : 1 + .24*t, g = t >= 0 ? 1 + .04*t : 1 + .02*t, b = t >= 0 ? 1 - .28*t : 1 - .30*t;
      const lum = .2126*r + .7152*g + .0722*b; return [r/lum, g/lum, b/lum];
    }
    const sCurve = (v, s) => clamp(v + s*(v-.5)*(.25-(v-.5)**2), 0, 1);
    function buildLUT(size, fn) {
      const data = new Uint8Array(size**3*4); let p = 0;
      for (let b=0;b<size;b++) for (let g=0;g<size;g++) for (let r=0;r<size;r++) {
        const [or,og,ob] = fn(r/(size-1),g/(size-1),b/(size-1));
        data[p++]=Math.round(clamp(or,0,1)*255); data[p++]=Math.round(clamp(og,0,1)*255); data[p++]=Math.round(clamp(ob,0,1)*255); data[p++]=255;
      }
      return { size, data };
    }
    function createBuiltinLuts() {
      const N = 17;
      return [
        { id:"none", name:"Gốc", swatch:"linear-gradient(135deg,#e4e4e7,#52525b)", custom:false, size:2, data:null },
        { id:"fuji", name:"Fuji Pro", swatch:"linear-gradient(135deg,#34d399,#0f766e)", custom:false, ...buildLUT(N,(r,g,b)=>{ r=sCurve(r,.55);g=sCurve(g,.6);b=sCurve(b,.5); const l=.299*r+.587*g+.114*b,sh=(1-l)**2; return [(l+(r-l)*.92)*.96+.02,(l+(g-l)*1.04)*.98+.03*sh+.015,(l+(b-l)*.96)*.97+.04*sh+.02]; }) },
        { id:"kodak", name:"Kodak Gold", swatch:"linear-gradient(135deg,#fbbf24,#b45309)", custom:false, ...buildLUT(N,(r,g,b)=>{ r=sCurve(r,.65);g=sCurve(g,.58);b=sCurve(b,.45); const l=.299*r+.587*g+.114*b; return [(l+(r-l)*1.12)*1.03+.025,l+(g-l)*1.04+.015,(l+(b-l)*.88)*.89+.01]; }) },
        { id:"teal", name:"Cine Teal", swatch:"linear-gradient(135deg,#06b6d4,#f97316)", custom:false, ...buildLUT(N,(r,g,b)=>{ r=sCurve(r,.8);g=sCurve(g,.72);b=sCurve(b,.75); const l=.299*r+.587*g+.114*b,sh=(1-l)**1.6,hi=l**1.5; return [r*.96-.06*sh+.09*hi,g*.98+.04*sh+.02*hi,b*.98+.1*sh-.08*hi]; }) },
        { id:"leica", name:"Leica B&W", swatch:"linear-gradient(135deg,#fff,#18181b)", custom:false, ...buildLUT(N,(r,g,b)=>{ const m=sCurve(.26*r+.62*g+.12*b,1.15); return [m,m,m]; }) },
        { id:"moody", name:"Moody Film", swatch:"linear-gradient(135deg,#64748b,#0f172a)", custom:false, ...buildLUT(N,(r,g,b)=>{ r=sCurve(r,.45);g=sCurve(g,.45);b=sCurve(b,.5); const l=.299*r+.587*g+.114*b; return [(l+(r-l)*.72)*.9+.035,(l+(g-l)*.76)*.91+.038,(l+(b-l)*.82)*.94+.045]; }) }
      ];
    }

    function parseCubeFile(text, fallbackName) {
      if (typeof text!=="string" || text.length>6e6 || text.includes("<html") || text.includes("<script")) throw new Error("File .cube không hợp lệ");

        const x0=Math.floor(x),x1=Math.min(size3D-1,x0+1),fx=x-x0, y0=Math.floor(y),y1=Math.min(size3D-1,y0+1),fy=y-y0, z0=Math.floor(z),z1=Math.min(size3D-1,z0+1),fz=z-z0;

    let gl=null, glProg=null, vTex=null, lTex=null, glLoc={}, useWebGL=false;

    function uploadLutGL(lut) {

    function renderGL(viewW, viewH, vidW, vidH, totalScale) {

    function applyColorToCanvas(c, lut, intensity, k) {
      const hasLut = lut?.data && intensity>0.001; if (!hasLut && k===5500) return;
      const c2d=c.getContext("2d"), img=c2d.getImageData(0,0,c.width,c.height), px=img.data, [rg,gg,bg]=getTempGains(k);
      if (!hasLut) { for(let i=0;i<px.length;i+=4){px[i]*=rg;px[i+1]*=gg;px[i+2]*=bg;} c2d.putImageData(img,0,0); return; }

        const sr=Math.min(255,px[i]*rg), sg=Math.min(255,px[i+1]*gg), sb=Math.min(255,px[i+2]*bg);
        const rx=sr*inv*n1, gy=sg*inv*n1, bz=sb*inv*n1;

          const c01=ld[i001+ch]+(ld[i101+ch]-ld[i001+ch])*fx, c11=ld[i011+ch]+(ld[i111+ch]-ld[i011+ch])*fx;
          px[i+ch]=(ch===0?sr:(ch===1?sg:sb))*im + ((c00+(c10-c00)*fy)*(1-fz)+(c01+(c11-c01)*fy)*fz)*intensity;

    function startScanPhase() {
      if (!aiEnabled) return;

    const scheduleNextAI = (ms=110) => { clearTimeout(aiTimerId); if (aiEnabled) aiTimerId = setTimeout(runAiStep, ms); };

    function processAIScanOrTrack(dets, vidW, vidH) {
      const now = performance.now();
      if (aiPhase === "scanning") {
        // Gom mẫu ổn định trong ~1.2 giây để chọn chủ thể & góc bố cục 1/3 đẹp nhất
        for (const d of dets) {
          const b = d.boundingBox, c = d.categories?.[0]; if (!c || IGNORE_BG.has(c.categoryName)) continue;
          const cx = b.originX + b.width/2, cy = b.originY + b.height/2;
          const centerBonus = 1.25 - Math.hypot(cx/vidW - 0.5, cy/vidH - 0.5) * 0.5;
          const sc = c.score * (c.categoryName==="person" ? 1.6 : 1.0) * centerBonus;
          scanSamples.push({ x:b.originX, y:b.originY, w:b.width, h:b.height, cx, cy, cat:c.categoryName, score:sc });
        }
        if (now - scanStartTs >= 1200 && scanSamples.length > 0) {
          // Chọn mẫu điểm cao nhất và trung bình hóa các mẫu gần nó
          scanSamples.sort((a,b) => b.score - a.score);
          const top = scanSamples[0];
          const cluster = scanSamples.filter(s => s.cat === top.cat && Math.hypot(s.cx-top.cx, s.cy-top.cy) < vidW*0.2);
          const avg = (k) => cluster.reduce((sum, s) => sum + s[k], 0) / cluster.length;
          const ax = avg("x"), ay = avg("y"), aw = avg("w"), ah = avg("h");
          lockedTrack = { x:ax, y:ay, w:aw, h:ah, cat:top.cat, missed:0 };
          // Chọn góc đẹp nhất theo quy tắc 1/3 (bên nào còn nhiều không gian thì đặt chủ thể sang bên còn lại)
          const fx = ax + aw/2;
          bestAnchor = {
            x: aw > vidW*0.5 ? 0.5 : (fx < vidW*0.5 ? 0.36 : 0.64),
            y: top.cat === "person" ? 0.34 : 0.43
          };
          aiPhase = "guiding"; alignStartTs = 0;
        }
        return;
      }

      if (!lockedTrack) return;
      const lcx = lockedTrack.x + lockedTrack.w/2, lcy = lockedTrack.y + lockedTrack.h/2;
      let best = null, bestDist = Infinity;
      for (const d of dets) {
        const b=d.boundingBox, cat=d.categories?.[0]?.categoryName;
        if (lockedTrack.cat==="person" && cat!=="person") continue;
        const dist = Math.hypot((b.originX+b.width/2)-lcx, (b.originY+b.height/2)-lcy);
        if (dist < Math.max(lockedTrack.w,lockedTrack.h)*0.95 + vidW*0.14 && dist < bestDist) { bestDist=dist; best=d; }
      }
      if (best) {
        const b=best.boundingBox;
        const alpha = Math.hypot((b.originX+b.width/2)-lcx, (b.originY+b.height/2)-lcy) > vidW*0.025 ? 0.25 : 0.08;
        lockedTrack.x += (b.originX-lockedTrack.x)*alpha; lockedTrack.y += (b.originY-lockedTrack.y)*alpha;
        lockedTrack.w += (b.width-lockedTrack.w)*alpha; lockedTrack.h += (b.height-lockedTrack.h)*alpha;
        lockedTrack.missed = 0;
      } else {
        lockedTrack.missed++;
        if (lockedTrack.missed > 16) startScanPhase(); // Mất dấu hoàn toàn > 1.8s -> quét lại
      }
    }

    function runAiStep() {
      if (!aiEnabled) return;
      if (!objectDetector || !video.videoWidth || !video.videoHeight || video.paused || isInferring) { scheduleNextAI(130); return; }
      isInferring = true; const t0 = performance.now();
      try {
        const vidW=video.videoWidth, vidH=video.videoHeight, aiW=320, aiH=Math.max(180,Math.round((vidH/vidW)*aiW));
        if (aiCanvas.width!==aiW || aiCanvas.height!==aiH) { aiCanvas.width=aiW; aiCanvas.height=aiH; }
        aiCtx.drawImage(video,0,0,aiW,aiH);
        const ts=Math.max(lastInferTs+1,Math.round(performance.now())); lastInferTs=ts;
        const res=objectDetector.detectForVideo(aiCanvas,ts), sx=vidW/aiW, sy=vidH/aiH;
        const dets=(res?.detections||[]).map(d=>({ categories:d.categories, boundingBox:{ originX:d.boundingBox.originX*sx, originY:d.boundingBox.originY*sy, width:d.boundingBox.width*sx, height:d.boundingBox.height*sy } }));
        processAIScanOrTrack(dets, vidW, vidH);
      } catch {} finally { isInferring = false; }
      scheduleNextAI(Math.max(90, Math.min(200, (performance.now()-t0)+55)));
    }

    async function applyHardwareFocus(xNorm, yNorm) {
      if (!videoTrack) return;
      try {
        const adv = [];
        if (camCaps.focusMode?.includes("continuous")) adv.push({ focusMode: "continuous" });
        if (xNorm!=null && camCaps.pointsOfInterest) adv.push({ pointsOfInterest: [{ x:xNorm, y:yNorm }] });
        if (adv.length) await videoTrack.applyConstraints({ advanced: adv });
      } catch {}
    }
    function applyHardwareZoom(targetZ) {
      if (!videoTrack || !camCaps.zoom) { hwZoom=1.0; return; }
      const desiredHw = clamp(targetZ, camCaps.zoom.min||1, camCaps.zoom.max||1), now=performance.now();
      if (Math.abs(desiredHw - hwZoom) >= 0.05 && now - lastHwApply > 110) {
        hwZoom = desiredHw; lastHwApply = now;
        videoTrack.applyConstraints({ advanced: [{ zoom: hwZoom }] }).catch(()=>{});
      }
    }

    async function startCamera() {

      if (currentStream) { currentStream.getTracks().forEach(t=>t.stop()); currentStream=null; videoTrack=null; }

      for (const c of [{audio:false,video:{facingMode:{ideal:facingMode},width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:60,max:60}}},{audio:false,video:{facingMode:{ideal:facingMode},width:{ideal:1920},height:{ideal:1080}}},{audio:false,video:{facingMode:{ideal:facingMode}}}]) {

      camCaps = (typeof videoTrack.getCapabilities === "function") ? (videoTrack.getCapabilities() || {}) : {};

      video.classList.toggle("mirrored",isFront); glCanvas.classList.toggle("mirrored",isFront); overlayCanvas.classList.toggle("mirrored",isFront);
      if (video.readyState < 1) await new Promise(r=>{ const t=setTimeout(r,1500); video.addEventListener("loadedmetadata",()=>{clearTimeout(t);r();},{once:true}); });

    }

    function computeIdealCrop(track, vidW, vidH, ratio) {
      let mw=vidW*.84, mh=mw/ratio; if(mh>vidH*.82){mh=vidH*.82;mw=mh*ratio;}
      if (!track) return { x:(vidW-mw)/2, y:(vidH-mh)/2, w:mw, h:mh };
      const isP = track.cat === "person";
      let cw = Math.max(track.w*1.85, track.h*(isP?1.5:1.65)*ratio), ch = cw/ratio;
      if (cw<vidW*.40) { cw=vidW*.40; ch=cw/ratio; }
      if (cw>vidW) { cw=vidW; ch=cw/ratio; }
      if (ch>vidH) { ch=vidH; cw=ch*ratio; }
      const scx=track.x+track.w/2, sfy=isP?track.y+track.h*.28:track.y+track.h/2;
      return {
        x: clamp(scx - cw*bestAnchor.x, 0, vidW - cw),
        y: clamp(sfy - ch*bestAnchor.y, 0, vidH - ch),
        w: cw, h: ch
      };
    }

    function drawOverlay(viewW, viewH, vidW, vidH, totalScale, crop, track, guidePt, subjPt) {
      ctx.clearRect(0, 0, viewW, viewH);
      const toX = (vx) => viewW/2 + (vx - camCX)*totalScale, toY = (vy) => viewH/2 + (vy - camCY)*totalScale;

      if (aiEnabled) {
        if (aiPhase === "scanning") {
          // Vòng quét tĩnh ở giữa màn hình
          const p = clamp((performance.now() - scanStartTs) / 1200, 0, 1);
          ctx.save(); ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=3;
          ctx.beginPath(); ctx.arc(viewW/2, viewH/2, 42, 0, Math.PI*2); ctx.stroke();
          ctx.strokeStyle="#60a5fa"; ctx.beginPath(); ctx.arc(viewW/2, viewH/2, 42, -Math.PI/2, -Math.PI/2 + Math.PI*2*p); ctx.stroke();
          ctx.restore();
        } else if (track) {
          // Khung bố cục 1/3 đẹp nhất
          let sx, sy, sw, sh;
          if (aiPhase === "guiding") {
            sh = Math.min(viewH*0.68, (viewW*0.84)/targetRatio); sw = sh*targetRatio;
            sx = (viewW - sw)/2; sy = (viewH - sh)/2;
          } else {
            sx = toX(crop.x); sy = toY(crop.y); sw = crop.w*totalScale; sh = crop.h*totalScale;
          }

          ctx.save(); ctx.fillStyle="rgba(0,0,0,.44)"; ctx.beginPath(); ctx.rect(0,0,viewW,viewH); ctx.rect(sx,sy,sw,sh); ctx.fill("evenodd"); ctx.restore();
          ctx.save(); ctx.strokeStyle=aiPhase==="ready"?"rgba(134,239,172,.45)":"rgba(255,255,255,.22)"; ctx.lineWidth=1;
          for(let i=1;i<=2;i++){ctx.beginPath();ctx.moveTo(sx+sw*i/3,sy);ctx.lineTo(sx+sw*i/3,sy+sh);ctx.stroke();ctx.beginPath();ctx.moveTo(sx,sy+sh*i/3);ctx.lineTo(sx+sw,sy+sh*i/3);ctx.stroke();}
          ctx.restore();
          ctx.save(); ctx.strokeStyle=aiPhase==="ready"?"#4ade80":"rgba(255,255,255,.72)"; ctx.lineWidth=aiPhase==="ready"?2.2:1.2; ctx.strokeRect(sx,sy,sw,sh);
          const cn=22; ctx.strokeStyle=aiPhase==="ready"?"#22c55e":"#fff"; ctx.lineWidth=3.5; ctx.lineCap="round";
          ctx.beginPath(); ctx.moveTo(sx,sy+cn);ctx.lineTo(sx,sy);ctx.lineTo(sx+cn,sy); ctx.moveTo(sx+sw-cn,sy);ctx.lineTo(sx+sw,sy);ctx.lineTo(sx+sw,sy+cn);
          ctx.moveTo(sx,sy+sh-cn);ctx.lineTo(sx,sy+sh);ctx.lineTo(sx+cn,sy+sh); ctx.moveTo(sx+sw-cn,sy+sh);ctx.lineTo(sx+sw,sy+sh);ctx.lineTo(sx+sw,sy+sh-cn);
          ctx.stroke(); ctx.restore();

          if (aiPhase === "guiding" && guidePt && subjPt) {
            // Vẽ vòng tròn đích + chấm chủ thể + mũi tên hướng dẫn lia cam
            ctx.save();
            ctx.strokeStyle="#fbbf24"; ctx.lineWidth=2.5; ctx.setLineDash([5,4]);
            ctx.beginPath(); ctx.arc(guidePt.x, guidePt.y, 24, 0, Math.PI*2); ctx.stroke();
            ctx.setLineDash([]);
            ctx.strokeStyle="rgba(251,191,36,.85)"; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(subjPt.x, subjPt.y); ctx.lineTo(guidePt.x, guidePt.y); ctx.stroke();
            ctx.fillStyle="#ffffff"; ctx.beginPath(); ctx.arc(subjPt.x, subjPt.y, 7, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle="#fbbf24"; ctx.lineWidth=2; ctx.stroke();
            ctx.restore();
          } else if (aiPhase === "ready" && subjPt) {
            ctx.save(); ctx.strokeStyle="#4ade80"; ctx.lineWidth=2.5;
            ctx.beginPath(); ctx.arc(subjPt.x, subjPt.y, 18, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle="#4ade80"; ctx.beginPath(); ctx.arc(subjPt.x, subjPt.y, 4, 0, Math.PI*2); ctx.fill();
            ctx.restore();
          }
        }
      }

      if (focusRing && performance.now() - focusRing.t < 900) {
        const age = (performance.now() - focusRing.t) / 900;
        ctx.save(); ctx.globalAlpha = 1 - age*0.6; ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(focusRing.x, focusRing.y, 26 - age*6, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
    }

    function renderLoop() {
      rafId = requestAnimationFrame(renderLoop);
      if (!video.videoWidth || !video.videoHeight || video.paused) return;
      const dpr=Math.min(window.devicePixelRatio||1,2), viewW=stage.clientWidth, viewH=stage.clientHeight;
      if (overlayCanvas.width!==Math.round(viewW*dpr)||overlayCanvas.height!==Math.round(viewH*dpr)) { overlayCanvas.width=Math.round(viewW*dpr); overlayCanvas.height=Math.round(viewH*dpr); }
      ctx.setTransform(dpr,0,0,dpr,0,0);

      const vidW=video.videoWidth, vidH=video.videoHeight, baseScale=Math.max(viewW/vidW, viewH/vidH);
      if (!camReady) { camCX=vidW/2; camCY=vidH/2; camReady=true; }

      const activeTrack = aiEnabled ? lockedTrack : null;
      const tc = computeIdealCrop(activeTrack, vidW, vidH, targetRatio);
      if (!smoothedCrop) smoothedCrop = { ...tc };
      else ["x","y","w","h"].forEach(k=>smoothedCrop[k]+=(tc[k]-smoothedCrop[k])*0.12);

      let desiredZoom = userZoom, targetCX = vidW/2, targetCY = vidH/2;
      if (aiEnabled && aiPhase === "ready" && activeTrack) {
        const fitZ = clamp(Math.min((vidW*0.8)/smoothedCrop.w, (vidH*0.8)/smoothedCrop.h), 1.0, 2.25);
        desiredZoom = Math.max(userZoom, fitZ);
        targetCX = smoothedCrop.x + smoothedCrop.w/2; targetCY = smoothedCrop.y + smoothedCrop.h/2;
      }

      activeZoom += (desiredZoom - activeZoom) * 0.12;
      applyHardwareZoom(activeZoom);
      const digitalZoom = Math.max(1.0, activeZoom / Math.max(1.0, hwZoom));
      const totalScale = baseScale * digitalZoom;
      const halfW = (viewW/2)/totalScale, halfH = (viewH/2)/totalScale;
      camCX = clamp(camCX + (targetCX - camCX)*0.12, halfW, vidW - halfW);
      camCY = clamp(camCY + (targetCY - camCY)*0.12, halfH, vidH - halfH);
      zoomInfo.textContent = `${activeZoom.toFixed(1)}×`;

      renderGL(viewW, viewH, vidW, vidH, totalScale);

      let guidePt = null, subjPt = null;
      if (aiEnabled && activeTrack) {
        const toX = (vx) => viewW/2 + (vx - camCX)*totalScale, toY = (vy) => viewH/2 + (vy - camCY)*totalScale;
        const fx = activeTrack.x + activeTrack.w/2, fy = activeTrack.cat==="person" ? activeTrack.y + activeTrack.h*.28 : activeTrack.y + activeTrack.h/2;
        subjPt = { x: toX(fx), y: toY(fy) };
        const sh = Math.min(viewH*0.68, (viewW*0.84)/targetRatio), sw = sh*targetRatio;
        guidePt = { x: (viewW-sw)/2 + sw*bestAnchor.x, y: (viewH-sh)/2 + sh*bestAnchor.y };

        if (aiPhase === "guiding") {
          const dist = Math.hypot(subjPt.x - guidePt.x, subjPt.y - guidePt.y);
          if (dist < 44) {
            if (!alignStartTs) alignStartTs = performance.now();
            if (performance.now() - alignStartTs > 320) aiPhase = "ready";
          } else {
            alignStartTs = 0;
          }
        }
      }

      if (!aiEnabled) setStatus("idle", "Chụp thường");
      else if (!objectDetector) setStatus("loading", "Đang nạp AI...");
      else if (aiPhase === "scanning") setStatus("loading", "Giữ yên máy • Đang quét góc đẹp...");
      else if (aiPhase === "guiding") setStatus("ai-wait", "Lia chấm trắng vào vòng tròn vàng");
      else if (aiPhase === "ready") setStatus("good", "Bố cục chuẩn • Bấm chụp!");

      drawOverlay(viewW, viewH, vidW, vidH, totalScale, smoothedCrop, activeTrack, guidePt, subjPt);
    }

    let pinchStartDist = 0, pinchStartZoom = 1;
    overlayCanvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        pinchStartDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        pinchStartZoom = userZoom;
      } else if (e.touches.length === 1 && video.videoWidth) {
        const rect = overlayCanvas.getBoundingClientRect();
        const rx = e.touches[0].clientX - rect.left, ry = e.touches[0].clientY - rect.top;
        focusRing = { x: facingMode==="user"?(rect.width-rx):rx, y: ry, t: performance.now() };
        applyHardwareFocus(clamp(rx/rect.width,0,1), clamp(ry/rect.height,0,1));
      }
    }, { passive: true });

    overlayCanvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2 && pinchStartDist > 0) {
        const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
        userZoom = clamp(pinchStartZoom * (d / pinchStartDist), 1.0, 5.0);
        zoomPills.forEach(p => p.classList.toggle("active", Math.abs(parseFloat(p.dataset.z) - userZoom) < 0.25));
      }
    }, { passive: true });

    zoomPills.forEach(p => p.onclick = () => { userZoom = parseFloat(p.dataset.z); zoomPills.forEach(x => x.classList.remove("active")); p.classList.add("active"); });
    rescanBtn.onclick = startScanPhase;

    async function captureFullRes() {
      if (!video.videoWidth) return;
      flashEl.classList.add("active"); setTimeout(()=>flashEl.classList.remove("active"),130);
      const vidW=video.videoWidth, vidH=video.videoHeight, viewW=stage.clientWidth, viewH=stage.clientHeight;
      const digitalZoom = Math.max(1.0, activeZoom / Math.max(1.0, hwZoom));
      const totalScale = Math.max(viewW/vidW, viewH/vidH) * digitalZoom;
      let sx, sy, sw, sh;
      if (aiEnabled && aiPhase==="ready" && smoothedCrop) {
        sx=Math.max(0,Math.round(smoothedCrop.x)); sy=Math.max(0,Math.round(smoothedCrop.y));
        sw=Math.min(vidW-sx,Math.round(smoothedCrop.w)); sh=Math.min(vidH-sy,Math.round(smoothedCrop.h));
      } else {
        sw=Math.min(vidW,Math.round(viewW/totalScale)); sh=Math.min(vidH,Math.round(viewH/totalScale));
        sx=clamp(Math.round(camCX-sw/2),0,vidW-sw); sy=clamp(Math.round(camCY-sh/2),0,vidH-sh);
      }
      const out=document.createElement("canvas"); out.width=sw; out.height=sh;
      const oc=out.getContext("2d"); if(facingMode==="user"){oc.translate(sw,0);oc.scale(-1,1);}
      oc.drawImage(video,sx,sy,sw,sh,0,0,sw,sh);
      const lut=getActiveLut(); applyColorToCanvas(out,lut,lutIntensity,kelvin);
      capturedDataUrl=out.toDataURL("image/jpeg",0.95); capturedBlob=await new Promise(r=>out.toBlob(r,"image/jpeg",0.95));
      previewImg.src=capturedDataUrl; previewRes.textContent=`${sw} × ${sh} px`; previewSub.textContent=`${lut?.name||"Gốc"} • ${kelvin}K • ${activeZoom.toFixed(1)}×`; previewModal.classList.add("open");
    }

    shutterBtn.onclick = captureFullRes;
    switchCamBtn.onclick = () => { facingMode = facingMode==="environment"?"user":"environment"; startCamera(); };
    toggleAiBtn.onclick = async () => {
      aiEnabled = !aiEnabled;
      toggleAiBtn.classList.toggle("on", aiEnabled);
      toggleAiBtn.textContent = aiEnabled ? "AI: Bật" : "AI: Tắt";
      ratioSwitch.classList.toggle("show", aiEnabled);
      if (aiEnabled) { await ensureAI(); startScanPhase(); scheduleNextAI(80); }
      else { clearTimeout(aiTimerId); aiPhase="off"; lockedTrack=null; rescanBtn.classList.remove("show"); }
    };
    ratioBtns.forEach(b=>b.onclick=()=>{ ratioBtns.forEach(x=>x.classList.remove("active")); b.classList.add("active"); targetRatio=parseFloat(b.dataset.ratio); });
    toggleColorBtn.onclick = () => { const op=colorDrawer.classList.toggle("open"); toggleColorBtn.classList.toggle("active-panel",op); };
    tempSlider.oninput = () => { kelvin=parseInt(tempSlider.value,10); updateColorUI(); };
    resetTempBtn.onclick = () => { kelvin=5500; tempSlider.value="5500"; updateColorUI(); };
    intensitySlider.oninput = () => { lutIntensity=parseInt(intensitySlider.value,10)/100; updateColorUI(); };
    openSourceBtn.onclick = () => sourceModal.classList.add("open");
    closeSourceBtn.onclick = () => sourceModal.classList.remove("open");
    pickFileBtn.onclick = () => lutFileInput.click();
    lutFileInput.onchange = async () => { const f=lutFileInput.files?.[0]; lutFileInput.value=""; if(!f)return; try{if(f.size>5e6)throw new Error("File > 5MB"); await addParsedLut(parseCubeFile(await f.text(),f.name));}catch(e){showToast(e.message);} };
    loadUrlBtn.onclick = async () => {
      const u=lutUrlInput.value.trim(); if(!u.startsWith("https://")){showToast("Chỉ dùng link https://");return;}
      loadUrlBtn.disabled=true; try{ const c=new AbortController(),t=setTimeout(()=>c.abort(),10000),res=await fetch(u,{signal:c.signal}); clearTimeout(t); if(!res.ok)throw new Error("Lỗi tải"); await addParsedLut(parseCubeFile(await res.text(),u.split("/").pop()?.split("?")[0]||"LUT")); lutUrlInput.value=""; }catch(e){showToast(e.message||"Lỗi tải");} finally{loadUrlBtn.disabled=false;}
    };
    retakeBtn.onclick = () => { previewModal.classList.remove("open"); capturedDataUrl=null; capturedBlob=null; };
    downloadBtn.onclick = () => {
      if(!capturedDataUrl) return; const fn=`AI_Cam_${new Date().toISOString().replace(/[:.]/g,"-").slice(0,19)}.jpg`;
      if(window.AndroidBridge?.saveImage){ window.AndroidBridge.saveImage(capturedDataUrl,fn); return; }
      const u=URL.createObjectURL(capturedBlob),a=document.createElement("a"); a.href=u; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),1500);
    };
    retryBtn.onclick = startCamera;
    window.handleBackAction = () => {
      if(sourceModal.classList.contains("open")){sourceModal.classList.remove("open");return true;}
      if(previewModal.classList.contains("open")){previewModal.classList.remove("open");capturedDataUrl=null;capturedBlob=null;return true;}
      if(colorDrawer.classList.contains("open")){colorDrawer.classList.remove("open");toggleColorBtn.classList.remove("active-panel");return true;}
      return false;
    };

    (async () => {
      initWebGL(); lutList = [...createBuiltinLuts(), ...(await loadCustomLuts())];
      renderLutStrip(); updateColorUI(); await startCamera(); setTimeout(ensureAI, 1200);
    })();
  </script>
</body>
</html>
